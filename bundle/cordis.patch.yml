# dsh-local-bridge — configuration-only DSH plugin bundle
#
# This is a Loader patch (the same dialect as the profile's cordis.patch.yml). It does
# NOT start the bridge process; the bridge is a separate local service (see ../bridge).
# Installing this bundle only registers the local OpenAI-compatible endpoint as a
# provider on @deepseek-ai/dsh-llm-pi-ai, which dsh-base already mounts (id: llm-pi-ai,
# empty config). An id-targeted override — not an insert — is intentional: llm-pi-ai is
# a single instance whose config.providers holds every provider, so a second row would
# create a duplicate service instead of adding one provider.
#
# Layer order note: the profile's own cordis.patch.yml is applied AFTER every bundle
# layer. If that file already contains an `- id: llm-pi-ai` override, it wins; merge the
# `providers.local-gateway` block below into it instead of relying on this bundle.
# See README.md -> "If you already configure llm-pi-ai yourself".
#
# `config` is replaced wholesale by the Loader (never deep-merged), which is why the
# compat block is restated here. The model list is account-specific: it reflects what
# this WorkBuddy account offered when the bundle was authored. Refresh it on any new
# machine with `node bridge/refresh-models.mjs --apply` (see bridge/README.md).

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local-gateway:
        displayName: WorkBuddy
        api: openai-completions
        baseURL: http://127.0.0.1:8791/v1
        # pi-ai refuses a provider with no credential at all ("No API key for
        # provider"). The local bridge does not validate this value.
        headers:
          Authorization: Bearer local-gateway-placeholder
        # Each entry needs an explicit contextWindow: pi-ai otherwise assumes a default
        # that is too small and rejects long sessions locally before sending anything.
        # reasoningEfforts also drives the thinking-strength selector in the UI.
        models:
          - id: hy4-preview
            name: Hy4 preview
            contextWindow: 960000
            maxTokens: 64000
            input: [text, image]
            reasoningEfforts: { high: high }
          - id: hy3
            name: Hy3
            contextWindow: 192000
            maxTokens: 64000
            input: [text, image]
            reasoningEfforts: { low: low, medium: medium, high: high }
          - id: hy3-x
            name: Hy3
            contextWindow: 192000
            maxTokens: 64000
            input: [text, image]
            reasoningEfforts: { low: low, medium: medium, high: high }
          - id: deepseek-v4.1-flash
            name: DeepSeek-V4.1-Flash
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max, off: null }
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1000000
            maxTokens: 64000
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 1000000
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: glm-5.3-flashx
            name: GLM-5.3-FlashX
            contextWindow: 1000000
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: glm-5.2
